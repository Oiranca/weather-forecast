<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aplicación del tiempo - Obtén el clima actual y pronóstico de 4 días" />
    <title>Pronóstico del Tiempo</title>
    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>☀️ Pronóstico del Tiempo</h1>
      </header>

      <main>
        <section class="search">
          <input
            type="text"
            id="city-input"
            placeholder="Introduce una ciudad..."
            autocomplete="off"
          />
          <button id="search-button">Buscar</button>
        </section>
        
        <div id="error-message" class="error"></div>

        <section id="weather-section" class="hidden"></section>

        <section id="forecast-container" class="forecast"></section>
      </main>
    </div>

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
